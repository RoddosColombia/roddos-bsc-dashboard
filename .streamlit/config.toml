# Identidad visual RODDOS — oscuro con efecto vidrio (glassmorphism).
# Colores de marca: negro, cian y verde. Ver utils.py (_ESTILO) para el vidrio y el fondo.

[theme]
base = "dark"
primaryColor = "#5BE49B"
backgroundColor = "#0E1214"
secondaryBackgroundColor = "#1C2225"
textColor = "#EEF2F4"
font = "sans serif"

[server]
# Sirve la carpeta static/ (logo de fondo) en /app/static/. El navegador la guarda en caché.
enableStaticServing = true
