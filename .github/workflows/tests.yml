# Corre todos los tests en cada push y en cada Pull Request.
# Usa solo los Excel de prueba (tests/fixtures_excel.py): no necesita datos reales ni secretos.
# Se prueba en 3.12 (desarrollo local) y 3.14 (la versión del servidor en Streamlit Cloud).
name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q